# Application
spring.application.name=shareit-gateway
server.port=8080
server.servlet.context-path=/

# Server URL
shareit-server.url=http://localhost:9090

# Validation
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.date-format=com.fasterxml.jackson.databind.util.StdDateFormat
spring.jackson.time-zone=UTC

# Logging
logging.level.ru.practicum.shareit=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.validation=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# HTTP Client
http.client.max-total=100
http.client.default-max-per-route=20

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always